<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Wall Clock</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle, #f5f5f5, #d3d3d3);
      font-family: Arial, sans-serif;
    }

    .clock {
      position: relative;
      width: 300px;
      height: 300px;
      border: 10px solid #333;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .clock::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      background: #333;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* Numbers around the clock */
    .number {
      position: absolute;
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
      transform: translate(-50%, -50%);
    }

    .number:nth-child(1) { top: 5%; left: 50%; } /* 12 */
    .number:nth-child(2) { top: 18%; left: 85%; } /* 1 */
    .number:nth-child(3) { top: 50%; left: 93%; } /* 2 */
    .number:nth-child(4) { top: 82%; left: 85%; } /* 3 */
    .number:nth-child(5) { top: 95%; left: 50%; } /* 6 */
    .number:nth-child(6) { top: 82%; left: 15%; } /* 7 */
    .number:nth-child(7) { top: 50%; left: 7%; }  /* 9 */
    .number:nth-child(8) { top: 18%; left: 15%; } /* 10 */

    /* Hands */
    .hand {
      position: absolute;
      width: 50%;
      height: 4px;
      background: #333;
      top: 50%;
      left: 50%;
      transform-origin: 100%;
      transform: rotate(90deg);
      transition: transform 0.05s linear;
    }

    .hour {
      height: 6px;
      width: 35%;
      background: #000;
      z-index: 3;
    }

    .minute {
      height: 4px;
      width: 45%;
      background: #666;
      z-index: 2;
    }

    .second {
      height: 2px;
      width: 50%;
      background: red;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="clock">
    <!-- Numbers -->
    <div class="number" style="top: 5%; left: 50%;">12</div>
    <div class="number" style="top: 18%; left: 85%;">1</div>
    <div class="number" style="top: 30%; left: 95%;">2</div>
    <div class="number" style="top: 50%; left: 93%;">3</div>
    <div class="number" style="top: 70%; left: 85%;">4</div>
    <div class="number" style="top: 95%; left: 50%;">6</div>
    <div class="number" style="top: 82%; left: 15%;">7</div>
    <div class="number" style="top: 50%; left: 7%;">9</div>
    <div class="number" style="top: 18%; left: 15%;">10</div>
    
    <!-- Clock Hands -->
    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>
  </div>

  <script>
    function setClock() {
      const now = new Date();

      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondHand = document.querySelector('.second');
      const minuteHand = document.querySelector('.minute');
      const hourHand = document.querySelector('.hour');

      const secondsDegree = (seconds / 60) * 360 + 90;
      const minutesDegree = (minutes / 60) * 360 + (seconds / 60) * 6 + 90;
      const hoursDegree = (hours % 12 / 12) * 360 + (minutes / 60) * 30 + 90;

      secondHand.style.transform = `rotate(${secondsDegree}deg)`;
      minuteHand.style.transform = `rotate(${minutesDegree}deg)`;
      hourHand.style.transform = `rotate(${hoursDegree}deg)`;
    }

    setInterval(setClock, 1000);
    setClock();
  </script>
</body>
</html>
