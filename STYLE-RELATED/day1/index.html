<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">Animation Classes</h1>
  <div class="container">
    <div class="animation-item bounce">
      <p>Bounce</p>
    </div>
    <div class="animation-item fadeIn">
      <p>Fade In</p>
    </div>
    <div class="animation-item flip">
      <p>Flip</p>
    </div>
    <div class="animation-item tada">
      <p>Tada</p>
    </div>
    <div class="animation-item heartbeat">
      <p>HeartBeat</p>
    </div>
    <div class="animation-item handshake">
      <p>HandShake</p>
    </div>
    <div class="animation-item zoomIn">
      <p>Zoom In</p>
    </div>
  </div>
</body>
</html>
